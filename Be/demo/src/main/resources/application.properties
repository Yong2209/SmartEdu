# ==========================================
# SMARTEDU APPLICATION CONFIGURATION
# ==========================================
spring.application.name=smartedu
server.port=8080

# ==========================================
# MYSQL DATABASE (XAMPP / phpMyAdmin)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/smartedu?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# FILE UPLOAD & STORAGE (BR-AI-01: Max 20MB)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
smartedu.storage.upload-dir=./uploads

# ==========================================
# JWT & SECURITY
# ==========================================
smartedu.jwt.secret=SmartEduSuperSecretKeyForJWTTokenGeneration2026DTUPlatformMustBe256BitsLong!
smartedu.jwt.access-expiration-ms=7200000
smartedu.jwt.refresh-expiration-ms=604800000
smartedu.encryption.aes-secret=SmartEduAES256SecretKeyForAIKeys!

# ==========================================
# AI PROVIDER (GEMINI / OPENAI - US11, US38)
# ==========================================
smartedu.ai.provider=GEMINI
smartedu.ai.model=gemini-2.0-flash
smartedu.ai.api-key=${GEMINI_API_KEY:}
smartedu.ai.timeout-ms=15000

# ==========================================
# MAIL SERVER (OTP & RESET PASSWORD - US02, US06)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
smartedu.mail.mock-enabled=true

# ==========================================
# SWAGGER / OPENAPI UI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html