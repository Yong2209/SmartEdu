# ==========================================
# SMARTEDU APPLICATION
# ==========================================

spring.application.name=smartedu

spring.datasource.url=${SMARTEDU_DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=SmartEdu_Connect_Retry;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SMARTEDU_DB_USERNAME:sa}
spring.datasource.password=${SMARTEDU_DB_PASSWORD:SmartEdu@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SMARTEDU_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

server.port=${SMARTEDU_SERVER_PORT:8080}

smartedu.cors.allowed-origins=${SMARTEDU_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}
smartedu.cors.allowed-origin-patterns=${SMARTEDU_CORS_ALLOWED_ORIGIN_PATTERNS:*}

smartedu.security.jwt.secret=${SMARTEDU_JWT_SECRET:}
smartedu.security.jwt.expiration-ms=${SMARTEDU_JWT_EXPIRATION_MS:3600000}

spring.mail.host=${SMARTEDU_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SMARTEDU_MAIL_PORT:587}
spring.mail.username=${SMARTEDU_MAIL_USERNAME:}
spring.mail.password=${SMARTEDU_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMARTEDU_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMARTEDU_MAIL_STARTTLS:true}
smartedu.mail.from=${SMARTEDU_MAIL_FROM:${SMARTEDU_MAIL_USERNAME:}}
smartedu.mail.console-fallback=${SMARTEDU_MAIL_CONSOLE_FALLBACK:true}

smartedu.auth.email-otp-expiration-minutes=${SMARTEDU_EMAIL_OTP_EXPIRATION_MINUTES:15}
smartedu.auth.max-email-otp-attempts=${SMARTEDU_EMAIL_OTP_MAX_ATTEMPTS:5}
smartedu.auth.password-reset-expiration-minutes=${SMARTEDU_PASSWORD_RESET_EXPIRATION_MINUTES:30}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# AI INTEGRATION (GEMINI)
# ==========================================
smartedu.ai.provider=${SMARTEDU_AI_PROVIDER:GEMINI}
smartedu.ai.model=${SMARTEDU_AI_MODEL:gemini-3-flash-preview}
smartedu.ai.api-key=${SMARTEDU_AI_API_KEY:}
smartedu.ai.timeout-ms=${SMARTEDU_AI_TIMEOUT_MS:45000}
