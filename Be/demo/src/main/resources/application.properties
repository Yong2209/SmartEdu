# ==========================================
# SMARTEDU APPLICATION
# ==========================================

spring.application.name=smartedu

spring.datasource.url=${SMARTEDU_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SmartEdu_Connect_Retry;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SMARTEDU_DB_USERNAME:}
spring.datasource.password=${SMARTEDU_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SMARTEDU_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

server.port=${SMARTEDU_SERVER_PORT:8080}

smartedu.cors.allowed-origins=${SMARTEDU_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}

smartedu.security.jwt.secret=${SMARTEDU_JWT_SECRET:}
smartedu.security.jwt.expiration-ms=${SMARTEDU_JWT_EXPIRATION_MS:3600000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html